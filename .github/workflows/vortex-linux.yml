name: Vortex Linux
on:
  push:
    branches: [main, 'vortex/**']
    paths:
      - 'fluxer_desktop/**'
      - '.github/workflows/vortex-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NODE_OPTIONS: --max-old-space-size=6144
      BUILD_CHANNEL: stable
      PUBLIC_RELEASE_CHANNEL: stable
      PUBLIC_BUILD_VERSION: 0.1.0
      BUILD_VERSION: 0.1.0
      FLUXER_DESKTOP_PRODUCTION: 'true'
      FLUXER_OFFLINE: '1'
      FLUXER_MODULES: '0'
      FLUXER_ELECTRON_DIST: ${{ github.workspace }}/electron-runtime
      USE_SYSTEM_FPM: 'true'
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install locked build tool versions
        run: |
          npm install --global pnpm@11.27.0
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: ci-cache
        with:
          path: target/debug/fluxer-ci
          key: vortex-desktop-tools-linux22-rust199-${{ hashFiles('Cargo.lock', 'tools/ci/src/**') }}
      - name: Install Linux audio and desktop build libraries
        run: tools/ci/run.sh build-desktop --step install_linux_deps
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.ci-cache.outputs.cache-hit != 'true'
        with:
          path: target/debug/fluxer-ci
          key: ${{ steps.ci-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: native-cache
        with:
          path: |
            fluxer_desktop/native/*/target
            ~/.cargo/registry
          key: vortex-native-linux22-rust199-${{ hashFiles('fluxer_desktop/native/**/Cargo.lock', 'fluxer_desktop/native/**/Cargo.toml') }}
      - name: Verify encrypted desktop database
        run: cargo test --locked --manifest-path fluxer_desktop/native/app-store/Cargo.toml
      - name: Check desktop types
        run: pnpm --filter fluxer_desktop typecheck
      - name: Build the bundled renderer
        run: pnpm --filter fluxer_app build:desktop
      - name: Build native desktop integrations
        run: pnpm --filter fluxer_desktop build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            fluxer_desktop/native/*/target
            ~/.cargo/registry
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Fetch pinned patched Electron runtime
        run: |
          mkdir electron-runtime
          cd electron-runtime
          curl --fail --location --retry 3 -O https://github.com/fluxerapp/fluxer/releases/download/desktop-electron-runtime-44.9.1-fluxer.1/electron-v44.9.1-linux-x64.zip
          curl --fail --location --retry 3 -O https://github.com/fluxerapp/fluxer/releases/download/desktop-electron-runtime-44.9.1-fluxer.1/electron-v44.9.1-linux-x64.fluxer.json
          sha256sum --check <<'CHECKSUMS'
          ae36cae3dd723d94b414302598014beb6230a0c596ac6dc7a2dc95a6198a2568  electron-v44.9.1-linux-x64.zip
          7eb2c5207392dc20e3a600b4608e1a9cdcbdfd0a9ad85a0b7f414906611733e9  electron-v44.9.1-linux-x64.fluxer.json
          CHECKSUMS
      - name: Package AppImage
        working-directory: fluxer_desktop
        run: pnpm exec electron-builder --linux AppImage --x64 --config electron-builder.config.cjs --config.extraMetadata.version=0.1.0 --publish never
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MagnetosphereLabs/VortexNode
          ref: 42fbb885876e6677a245b1afddc4938ebce22cf1
          path: node-server
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node-server/target
            ~/.cargo/registry
          key: vortex-node-linux22-rust199-${{ hashFiles('node-server/Cargo.lock') }}
      - name: Build matching test Node
        run: cargo build --locked --manifest-path node-server/Cargo.toml
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb gnome-keyring dbus-x11
          npm install --prefix .vortex-tools --no-audit --no-fund playwright@1.58.2
          sudo chown root:root fluxer_desktop/dist-electron/linux-unpacked/chrome-sandbox
          sudo chmod 4755 fluxer_desktop/dist-electron/linux-unpacked/chrome-sandbox
      - name: Test packaged Linux app
        env:
          VORTEX_NODE_BINARY: ${{ github.workspace }}/node-server/target/debug/vortex-node
          VORTEX_DESKTOP_BINARY: ${{ github.workspace }}/fluxer_desktop/dist-electron/linux-unpacked/vortex-chat
          VORTEX_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.vortex-tools/node_modules/playwright/index.mjs
        run: |
          dbus-run-session -- bash -c '
            printf %s ci-test-keyring | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node fluxer_app/scripts/VortexDesktopSmoke.mjs
          '
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vortex-desktop-results
          path: desktop-results
          retention-days: 7
      - name: Archive installable Linux application
        run: tar --dereference -C fluxer_desktop/dist-electron/linux-unpacked -czf vortex-chat-linux-x64.tar.gz .
      - name: Hash Linux artifacts
        run: |
          find fluxer_desktop -maxdepth 3 -name '*.AppImage' -exec sha256sum {} + > Linux-SHA256SUMS
          sha256sum vortex-chat-linux-x64.tar.gz >> Linux-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vortex-chat-linux-x64
          path: |
            fluxer_desktop/**/*.AppImage
            Linux-SHA256SUMS
            vortex-chat-linux-x64.tar.gz
          retention-days: 14
