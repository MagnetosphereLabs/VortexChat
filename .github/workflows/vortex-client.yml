name: Vortex clients
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vortex-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUXER_CI_BIN: ${{ github.workspace }}/target/debug/fluxer-ci
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NODE_OPTIONS: --max-old-space-size=6144
      PUBLIC_BUILD_VERSION: 0.1.0
      PUBLIC_BUILD_SHA: ${{ github.sha }}
      PUBLIC_RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$sources" ]; then sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$sources"; fi
          done
          npm install --global pnpm@11.27.0
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install --yes clang lld pkg-config
      - name: Check release qualification rules
        run: python3 scripts/test-publish-vortex-release.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare pinned encryption modules
        run: pnpm --filter fluxer_app vortex:vendor
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MagnetosphereLabs/VortexNode
          ref: 974974209c3bc61dfa7dddd64d7e1821467e7374
          path: node-server
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: node-cache
        with:
          path: |
            node-server/target
            ~/.cargo/registry
          key: vortex-node-linux-rust199-${{ hashFiles('node-server/Cargo.lock') }}
      - name: Build the matching Node
        run: cargo build --locked --manifest-path node-server/Cargo.toml
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.node-cache.outputs.cache-hit != 'true'
        with:
          path: |
            node-server/target
            ~/.cargo/registry
          key: ${{ steps.node-cache.outputs.cache-primary-key }}
      - name: Verify encrypted client flows against Node
        env:
          VORTEX_NODE_BINARY: ${{ github.workspace }}/node-server/target/debug/vortex-node
        run: pnpm --filter fluxer_app vortex:test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: renderer-tools
        with:
          path: |
            target/debug/fluxer-ci
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            packages/markdown_parser/rust/target
            fluxer_app/rust/libfluxcore/target
            fluxer_app/rust/libfluxwebp/target
          key: vortex-renderer-tools-linux24-rust199-${{ hashFiles('Cargo.lock', 'tools/ci/**', 'packages/markdown_parser/rust/Cargo.lock', 'fluxer_app/rust/**/Cargo.lock') }}
      - name: Build encrypted web client
        run: pnpm --filter fluxer_app build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.renderer-tools.outputs.cache-hit != 'true'
        with:
          path: |
            target/debug/fluxer-ci
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            packages/markdown_parser/rust/target
            fluxer_app/rust/libfluxcore/target
            fluxer_app/rust/libfluxwebp/target
          key: ${{ steps.renderer-tools.outputs.cache-primary-key }}
      - name: Check client types
        id: types
        run: pnpm --filter fluxer_app typecheck:only
      - name: Install browser test tools
        timeout-minutes: 3
        run: |
          npm install --prefix .vortex-tools --no-audit --no-fund playwright@1.58.2
      - name: Test Chrome sign-in and encrypted messaging
        id: chrome
        timeout-minutes: 5
        env:
          VORTEX_NODE_BINARY: ${{ github.workspace }}/node-server/target/debug/vortex-node
          VORTEX_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.vortex-tools/node_modules/playwright/index.mjs
          VORTEX_BROWSERS: chromium
          VORTEX_CHROME_CHANNEL: chrome
        run: node fluxer_app/scripts/VortexBrowserSmoke.mjs
      - name: Verify encrypted video, shared audio and media revocation
        id: media
        timeout-minutes: 5
        env:
          VORTEX_NODE_BINARY: ${{ github.workspace }}/node-server/target/debug/vortex-node
          VORTEX_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.vortex-tools/node_modules/playwright/index.mjs
        run: node fluxer_app/scripts/VortexMediaSmoke.mjs
      - name: Install Firefox and WebKit
        timeout-minutes: 8
        run: .vortex-tools/node_modules/.bin/playwright install --with-deps firefox webkit
      - name: Test Firefox and WebKit sign-in and encrypted messaging
        id: other-browsers
        timeout-minutes: 6
        env:
          VORTEX_NODE_BINARY: ${{ github.workspace }}/node-server/target/debug/vortex-node
          VORTEX_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.vortex-tools/node_modules/playwright/index.mjs
          VORTEX_BROWSERS: firefox,webkit
        run: node fluxer_app/scripts/VortexBrowserSmoke.mjs
      - name: Require browser, media and type checks
        if: always() && (steps.types.outcome != 'success' || steps.chrome.outcome != 'success' || steps.media.outcome != 'success' || steps.other-browsers.outcome != 'success')
        run: exit 1
      - name: Record runner memory diagnostics
        if: failure()
        run: |
          free -m
          sudo dmesg --ctime | tail -50
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vortex-browser-results
          path: browser-results
          retention-days: 7
      - name: Archive web client and provenance
        if: steps.types.outcome == 'success'
        run: |
          cp fluxer_app/src/vortex/vendor/PROVENANCE.json fluxer_app/dist/vortex-crypto-provenance.json
          cp fluxer_app/src/vortex/vendor/THIRD_PARTY_NOTICES.txt fluxer_app/dist/vortex-crypto-notices.txt
          tar -C fluxer_app/dist -czf vortex-chat-web.tar.gz .
          sha256sum vortex-chat-web.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.types.outcome == 'success'
        with:
          name: vortex-chat-web
          path: |
            vortex-chat-web.tar.gz
            SHA256SUMS
          retention-days: 14
      - name: Require successful type checking
        if: always() && steps.types.outcome != 'success'
        run: exit 1
